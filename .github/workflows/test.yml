on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      authkey:
        description: "authkey"
        required: false

jobs:
  test:
    strategy:
      fast-fail: false
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Connect to Tailscale
        uses: celsiusnarhwal/tailnet-link@main
        with:
          authkey: ${{ inputs.authkey || secrets.TS_OAUTH_SECRET }}
          tags: tag:github-actions
          extra-args: --accept-routes --accept-dns