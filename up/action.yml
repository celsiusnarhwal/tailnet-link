name: Tailnet Link Up
description: Connect your GitHub Actions workflow to Tailscale
branding:
  icon: arrow-right-circle
  color: gray-dark
inputs:
  authkey:
    description: A Tailscale auth key or OAuth client secret.
    required: true
  tags:
    description: |
      A comma-separated list of tags to apply to nodes authenticated by this action.
    required: false
  extra-args:
    description: Optional additional arguments to `tailscale up`.
    required: false
  tailscaled-extra-args:
    description: Optional additional arguments to `tailscaled`.
    required: false
  hostname:
    description: A fixed machine name.
    required: false


runs:
  using: composite
  steps:
    - name: Get Relative Path to Main Action
      id: action
      shell: python
      run: |
        import os
        from pathlib import Path

        path = Path(os.path.relpath(os.getenv("ACTION_PATH") + "/.."))
        print(f"path={path}", file=open(os.getenv("GITHUB_OUTPUT"), "a"))

    - name: Connect to Tailscale
      uses: jenseng/dynamic-uses@v1
      with:
        uses: ./${{ steps.action.outputs.path }}
        with: ${{ toJSON(inputs) }}
      env:
        _TAILNET_LINK_DO_NOT_DISCONNECT: 1