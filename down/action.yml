name: Tailnet Link Down
description: Disconnect your GitHub Actions workflow from Tailscale
branding:
  icon: arrow-right-circle
  color: gray-dark


runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@v3

    - name: Disconnect from Tailscale
      shell: bash
      run: uvx git+https://github.com/celsiusnarhwal/tailnet-link/#subdirectory=tscmd logout